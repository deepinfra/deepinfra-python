[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepinfra"
dynamic = ["version"]
description = "Official Python SDK for the DeepInfra API: sandboxes and inference"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "DeepInfra", email = "feedback@deepinfra.com" }]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.5,<3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://deepinfra.com"
Repository = "https://github.com/deepinfra/deepinfra-python"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "mypy",
    "ruff",
    "coverage",
]

[tool.hatch.version]
path = "deepinfra/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["deepinfra"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
files = ["deepinfra"]
strict = true

# Legacy (pre-0.2) modules are typed loosely; new code is strict.
[[tool.mypy.overrides]]
module = [
    "deepinfra.models.*",
    "deepinfra.types.*",
    "deepinfra.utils.*",
    "deepinfra.constants.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
disallow_any_generics = false
implicit_reexport = true

[tool.ruff]
line-length = 100
target-version = "py39"
# Legacy modules keep their 2024 style; don't churn them for lint's sake.
extend-exclude = [
    "deepinfra/models",
    "deepinfra/types",
    "deepinfra/utils",
    "deepinfra/constants",
    "deepinfra/exceptions",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
